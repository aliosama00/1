<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Dev Ali Osama / كولد هين المطور علي أسامة</title>
    <style>
        :root {
            --neon-blue: #00f0ff;
            --ps-blue: #0070d1;
            --neon-glow: rgba(0, 240, 255, 0.4);
            --bg-dark: #05070d;
            --card-bg: rgba(10, 15, 29, 0.85);
            --border-line: rgba(0, 240, 255, 0.25);
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --success: #00ff88;
            --warning: #ffb703;
            --danger: #ff0055;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Arabic', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(0, 112, 209, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 50% 90%, rgba(0, 240, 255, 0.1) 0%, transparent 60%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
            direction: rtl;
            overflow-x: hidden;
        }

        .hud-container {
            width: 100%;
            max-width: 760px;
            background: var(--card-bg);
            border: 1px solid var(--border-line);
            border-radius: 24px;
            padding: 35px 25px;
            position: relative;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.85),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 0 25px rgba(0, 240, 255, 0.15);
            text-align: center;
        }

        .hud-container::before {
            content: '';
            position: absolute;
            top: -2px; left: 50px; right: 50px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
            box-shadow: 0 0 10px var(--neon-blue);
        }

        header, .site-header {
            background: transparent !important;
            background-color: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            margin: 0 0 20px 0 !important;
        }

        .header-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent !important;
        }

        .logo-frame {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent !important;
        }

        .logo-frame::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px dashed rgba(0, 240, 255, 0.6);
            animation: rotateRing 15s linear infinite;
        }

        @keyframes rotateRing {
            100% { transform: rotate(360deg); }
        }

        .header-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-glow);
            z-index: 2;
        }

        .main-title {
            font-size: 1.9rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            color: #ffffff !important;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
            margin-bottom: 8px;
            background: transparent !important;
        }

        .sub-tagline {
            font-size: 0.8rem;
            color: var(--text-sub) !important;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
            font-weight: 600;
            direction: ltr;
            background: transparent !important;
        }

        .dev-badge-wrapper {
            margin-bottom: 20px;
            background: transparent !important;
        }

        .dev-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(90deg, rgba(0, 112, 209, 0.3), rgba(0, 240, 255, 0.3)) !important;
            border: 1px solid var(--neon-blue) !important;
            padding: 8px 22px;
            border-radius: 50px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
        }

        .dev-badge a {
            color: #ffffff !important;
            text-decoration: none;
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            direction: ltr;
        }

        .dev-badge .dot {
            width: 8px;
            height: 8px;
            background: var(--neon-blue);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-blue);
        }

        /* مربع عداد الزوار السايبيربانك */
        .visitor-dock {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(3, 7, 18, 0.7);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 16px;
            padding: 12px 20px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.05);
        }

        .visitor-dock::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 4px;
            height: 100%;
            background: var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue);
        }

        .visitor-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: right;
        }

        .radar-box {
            position: relative;
            width: 38px;
            height: 38px;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .radar-pulse {
            width: 10px;
            height: 10px;
            background: var(--neon-blue);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-blue);
            animation: pulseGlow 1.8s infinite;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.9); box-shadow: 0 0 5px var(--neon-blue); }
            50% { transform: scale(1.3); box-shadow: 0 0 15px var(--neon-blue); }
            100% { transform: scale(0.9); box-shadow: 0 0 5px var(--neon-blue); }
        }

        .visitor-titles {
            display: flex;
            flex-direction: column;
        }

        .visitor-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .visitor-sub {
            font-size: 0.72rem;
            color: var(--text-sub);
            font-family: monospace;
            direction: ltr;
            text-align: right;
        }

        .visitor-stats {
            display: flex;
            align-items: baseline;
            gap: 6px;
            direction: ltr;
        }

        #visitor-count {
            font-size: 1.5rem;
            font-weight: 900;
            font-family: 'Consolas', 'Courier New', monospace;
            color: var(--neon-blue);
            text-shadow: 0 0 12px var(--neon-glow);
            letter-spacing: 2px;
        }

        .visitor-unit {
            font-size: 0.75rem;
            color: var(--text-sub);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .telemetry-box {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            background: rgba(3, 7, 18, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
        }

        #UA {
            font-size: 0.9rem;
            color: #38bdf8;
            font-family: 'Courier New', Courier, monospace;
            direction: ltr;
            letter-spacing: 0.5px;
        }

        #det {
            font-size: 0.85rem;
            color: var(--text-sub);
            font-family: monospace;
            direction: ltr;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 10px;
        }

        #det b {
            color: var(--neon-blue);
        }

        #state {
            width: 100%;
            padding: 20px;
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(180deg, #111827 0%, #0b0f19 100%);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        #state::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 3px;
            background: var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue);
        }

        #state.warn {
            background: linear-gradient(180deg, #2d1800 0%, #170d00 100%);
            border-color: var(--warning);
            color: #ffe066;
        }
        #state.warn::after {
            background: var(--warning);
            box-shadow: 0 0 10px var(--warning);
        }

        #state.bad {
            background: linear-gradient(180deg, #2e0813 0%, #150308 100%);
            border-color: var(--danger);
            color: #ff99bb;
        }
        #state.bad::after {
            background: var(--danger);
            box-shadow: 0 0 10px var(--danger);
        }

        #cache {
            margin-top: 12px;
            font-size: 0.85rem;
            font-family: monospace;
            direction: ltr;
            color: var(--text-sub);
            letter-spacing: 0.5px;
        }

        #cache.cacheok {
            color: var(--success);
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.4);
        }

        .hud-footer {
            margin-top: 30px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #475569;
            direction: ltr;
        }

        .controller-hint {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--neon-blue);
            font-weight: bold;
        }

        .controller-hint span {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 1px solid var(--neon-blue);
            border-radius: 50%;
            line-height: 16px;
            text-align: center;
            font-size: 0.7rem;
        }

        @media (max-width: 600px) {
            .main-title { font-size: 1.4rem; }
            .hud-container { padding: 25px 15px; }
            .hud-footer { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="hud-container">
        <header class="site-header">
            <div class="header-content">
                <div class="logo-frame">
                    <img src="includes/logo.png" alt="Dev Logo" class="header-logo" onerror="this.style.display='none'; document.querySelector('.logo-frame').style.display='none';">
                </div>

                <h1 class="main-title">كولد هين المطور علي أسامة</h1>
                <p class="sub-tagline">PlayStation 4 Exploit Architecture</p>

                <div class="dev-badge-wrapper">
                    <div class="dev-badge">
                        <div class="dot"></div>
                        <a href="https://t.me/BBTBB" target="_blank">DEV : @BBTBB</a>
                    </div>
                </div>
            </div>
        </header>

        <!-- مربع عداد الزوار الذكي -->
        <div class="visitor-dock">
            <div class="visitor-meta">
                <div class="radar-box">
                    <div class="radar-pulse"></div>
                </div>
                <div class="visitor-titles">
                    <span class="visitor-title">إجمالي الزيارات</span>
                    <span class="visitor-sub">TOTAL VISITS COUNTER</span>
                </div>
            </div>
            <div class="visitor-stats">
                <span id="visitor-count">50</span>
                <span class="visitor-unit">HITS</span>
            </div>
        </div>

        <div class="telemetry-box">
            <div id="UA">Detecting firmware...</div>
            <div id="det"></div>
        </div>

        <div class="action-dock">
            <div id="state">Detecting firmware...</div>
            <div id="cache"></div>
        </div>

        <footer class="hud-footer">
            <div>HOST CORE v13.52 &middot; &copy; 2026 Ali Osama</div>
            <div class="controller-hint">
                <span>&#10005;</span> PRESS X TO EXECUTE
            </div>
        </footer>
    </div>

<script>
/* تشغيل عداد الزوار المتطور (يبدأ من 50 ويزداد مباشرة عند كل فتح) */
(function setupVisitorCounter() {
    var countEl = document.getElementById("visitor-count");
    var baseVisits = 50;
    var storageKey = "aliosama_visits_v50"; // مفتاح محدث لإلغاء القيمة القديمة
    
    // جلب القيمة المخزنة وزيادتها فوراً لكل زيارة
    var current = parseInt(localStorage.getItem(storageKey) || baseVisits, 10);
    current++;
    localStorage.setItem(storageKey, current);

    function render(num) {
        if (countEl) countEl.textContent = Number(num).toLocaleString('en-US');
    }
    render(current);

    // المزامنة العالمية السحابية في حال وجود إنترنت
    if (navigator.onLine) {
        fetch("https://api.counterapi.dev/v1/aliosama_ps4_global/hits/up")
            .then(function(res) {
                if (!res.ok) throw new Error("HTTP error " + res.status);
                return res.json();
            })
            .then(function(data) {
                if (data && typeof data.count === "number") {
                    var total = baseVisits + data.count;
                    if (total > current) {
                        localStorage.setItem(storageKey, total);
                        render(total);
                    }
                }
            })
            .catch(function(err) {
                // العمل بنظام الأوفلاين الداخلي بسلاسة عند تعذر السيرفر
            });
    }
})();

/* فحص نظام البلايستيشن والتحويل المباشر لصفحة jb.html وحفظ الكاش */
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }
    var bug = null, why = "";
    var forced = params.get("bug");
    if (forced === "lapse" || forced === "poops") {
        bug = forced; why = "forced via ?bug=" + forced;
    } else if (!key) {
        why = "user-agent is not a PlayStation 4";
    } else if (fwnum <= 1202) {
        bug = "lapse"; why = key + " <= 12.02";
    } else if (fwnum >= 1250) {
        bug = "poops"; why = key + " >= 12.50";
    } else {
        why = key + " -- no working bug (lapse ends at 12.02, poops needs 12.50)";
    }
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + " &middot; bug <b>" + (bug || "none") + "</b> &middot; " + why;

    if (!bug) { setState("UNSUPPORTED FIRMWARE", "bad"); return; }

    /* التوجيه الصحيح لصفحة jb.html لمنع خطأ 404 */
    var target = "jb.html" + location.search;

    function go() { 
        setState("loading exploit...", "warn");
        location.replace(target); 
    }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);

        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run",
                       function () { location.reload(); });
        }, false);

        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
</body>
</html>
