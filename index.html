<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dev Ali Osama / كولد هين المطور علي أسامة</title>
    <!-- استدعاء ملف الستايل الخارجي في حال توفره -->
    <link rel="stylesheet" href="includes/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at top, #0f172a, #030712);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            direction: rtl;
        }

        .host-wrapper {
            width: 100%;
            max-width: 720px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8), 0 0 15px rgba(56, 189, 248, 0.1);
        }

        .header-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        /* تنسيق الشعار - يمكنك استبدال الملف في includes/logo.png */
        .header-logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.5));
        }

        .main-title {
            font-size: 1.8rem;
            color: #38bdf8;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        /* وسم المطور والحساب */
        .dev-badge {
            display: inline-block;
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.2), rgba(99, 102, 241, 0.2));
            border: 1px solid #38bdf8;
            border-radius: 30px;
            padding: 5px 18px;
            margin-top: 4px;
        }

        .dev-badge a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            letter-spacing: 1px;
            direction: ltr;
            display: inline-block;
        }

        .divider {
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.3), transparent);
            margin: 20px 0;
        }

        #UA {
            font-size: 1rem;
            color: #94a3b8;
            font-family: monospace;
            background: rgba(3, 7, 18, 0.6);
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: inline-block;
            margin-bottom: 15px;
            direction: ltr;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            margin-top: 10px;
        }

        #state {
            width: 100%;
            padding: 16px;
            font-size: 1.25rem;
            font-weight: bold;
            background: #1e293b;
            border-radius: 10px;
            border: 1px solid #334155;
            color: #f1f5f9;
            transition: all 0.3s ease;
        }

        /* كلاسات التحكم البرمجية */
        #state.warn {
            background: #854d0e;
            border-color: #eab308;
            color: #fef08a;
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.3);
        }

        #state.bad {
            background: #991b1b;
            border-color: #ef4444;
            color: #fee2e2;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
        }

        #det {
            font-size: 0.95rem;
            color: #cbd5e1;
            font-family: monospace;
            direction: ltr;
        }

        #det b {
            color: #38bdf8;
        }

        #cache {
            font-size: 0.9rem;
            color: #94a3b8;
            font-family: monospace;
            direction: ltr;
        }

        #cache.cacheok {
            color: #4ade80;
            font-weight: bold;
        }

        .footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="host-wrapper">
        <header class="site-header">
            <div class="header-content">
                <!-- مكان اللوجو: ضع صورتك باسم logo.png داخل مجلد includes -->
                <img src="includes/logo.png" alt="Dev Logo" class="header-logo" onerror="this.style.display='none'">
                <div class="header-titles">
                    <h1 class="main-title">كولد هين المطور علي أسامة</h1>
                    <div class="dev-badge">
                        <a href="https://t.me/BBTBB" target="_blank">DEV : @BBTBB</a>
                    </div>
                </div>
            </div>
        </header>

        <div id="UA">Detecting firmware...</div>
        <hr class="divider">

        <div class="btn-container">
            <div id="state">Detecting firmware...</div>
            <div id="det"></div>
            <div id="cache"></div>
        </div>

        <footer class="footer">
            <p>PS4 Framework & Host Engine &copy; 2026 Ali Osama</p>
        </footer>
    </div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }
    var bug = null, why = "";
    var forced = params.get("bug");
    if (forced === "lapse" || forced === "poops") {
        bug = forced; why = "forced via ?bug=" + forced;
    } else if (!key) {
        why = "user-agent is not a PlayStation 4";
    } else if (fwnum <= 1202) {
        bug = "lapse"; why = key + " <= 12.02";
    } else if (fwnum >= 1250) {
        bug = "poops"; why = key + " >= 12.50";
    } else {
        why = key + " -- no working bug (lapse ends at 12.02, poops needs 12.50)";
    }
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + " &middot; bug <b>" + (bug || "none") + "</b> &middot; " + why;

    if (!bug) { setState("UNSUPPORTED FIRMWARE", "bad"); return; }

    var target = (bug === "lapse" ? "run_lapse.html" : "run_poops.html")
        + location.search;
    function go() { setState("loading " + bug + " chain...", "warn");
                    location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);

        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run",
                       function () { location.reload(); });
        }, false);

        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
</body>
</html>
