<script>
/* تشغيل وتصحيح عداد الزوار الذكي */
(function setupVisitorCounter() {
    var countEl = document.getElementById("visitor-count");
    var baseVisits = 50; // البداية من 50 كما طلبت
    var storageKey = "aliosama_visits_v50"; // مفتاح جديد لتصفير الـ 1420 القديمة فوراً
    
    // جلب القيمة الحالية وزيادتها فوراً لكل زيارة
    var current = parseInt(localStorage.getItem(storageKey) || baseVisits, 10);
    current++;
    localStorage.setItem(storageKey, current);

    function render(num) {
        if (countEl) countEl.textContent = Number(num).toLocaleString('en-US');
    }
    render(current);

    // محاولة المزامنة السحابية العامة إذا وُجد إنترنت
    if (navigator.onLine) {
        fetch("https://api.counterapi.dev/v1/aliosama_ps4_global/hits/up")
            .then(function(res) {
                if (!res.ok) throw new Error("Server response not ok");
                return res.json();
            })
            .then(function(data) {
                if (data && typeof data.count === "number") {
                    var total = baseVisits + data.count;
                    if (total > current) {
                        localStorage.setItem(storageKey, total);
                        render(total);
                    }
                }
            })
            .catch(function(err) {
                // في حال تعذر السيرفر الخارجي يستمر العداد بالزيادة محلياً بسلاسة
            });
    }
})();
</script>
