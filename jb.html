<!doctype html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dev Ali Osama / كولد هين المطور علي أسامة</title>
    <script>
      (function () {
        if (!/PlayStation\s*4/i.test(navigator.userAgent)) {
          document.documentElement.removeAttribute("manifest");
        }
      })();
    </script>
    <style>
      :root {
        --neon-blue: #00f0ff;
        --ps-blue: #0070d1;
        --neon-glow: rgba(0, 240, 255, 0.4);
        --bg-dark: #05070d;
        --card-bg: rgba(10, 15, 29, 0.85);
        --border-line: rgba(0, 240, 255, 0.25);
        --text-main: #f1f5f9;
        --text-sub: #94a3b8;
        --success: #00ff88;
        --warning: #ffb703;
        --danger: #ff0055;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Arabic', sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }

      body {
        background-color: var(--bg-dark);
        background-image: 
          radial-gradient(circle at 50% 10%, rgba(0, 112, 209, 0.25) 0%, transparent 50%),
          radial-gradient(circle at 50% 90%, rgba(0, 240, 255, 0.1) 0%, transparent 60%),
          linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px 15px;
        direction: rtl;
        overflow-x: hidden;
      }

      .hud-container {
        width: 100%;
        max-width: 760px;
        background: var(--card-bg);
        border: 1px solid var(--border-line);
        border-radius: 24px;
        padding: 35px 25px;
        position: relative;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 
          0 20px 50px rgba(0, 0, 0, 0.85),
          inset 0 1px 0 rgba(255, 255, 255, 0.1),
          0 0 25px rgba(0, 240, 255, 0.15);
        text-align: center;
      }

      .hud-container::before {
        content: '';
        position: absolute;
        top: -2px; left: 50px; right: 50px;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
        box-shadow: 0 0 10px var(--neon-blue);
      }

      .site-header {
        background: transparent !important;
        margin: 0 0 20px 0 !important;
      }

      .logo-frame {
        position: relative;
        width: 105px;
        height: 105px;
        margin: 0 auto 15px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .logo-frame::after {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        border: 2px dashed rgba(0, 240, 255, 0.6);
        animation: rotateRing 15s linear infinite;
      }

      @keyframes rotateRing {
        100% { transform: rotate(360deg); }
      }

      .header-logo {
        width: 95px;
        height: 95px;
        object-fit: contain;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.5);
        border: 2px solid var(--neon-blue);
        box-shadow: 0 0 15px var(--neon-glow);
        z-index: 2;
      }

      .main-title {
        font-size: 1.9rem;
        font-weight: 900;
        letter-spacing: 0.5px;
        color: #ffffff !important;
        text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
        margin-bottom: 8px;
      }

      .sub-tagline {
        font-size: 0.8rem;
        color: var(--text-sub) !important;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 15px;
        font-weight: 600;
        direction: ltr;
      }

      .dev-badge-wrapper {
        margin-bottom: 20px;
      }

      .dev-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: linear-gradient(90deg, rgba(0, 112, 209, 0.3), rgba(0, 240, 255, 0.3));
        border: 1px solid var(--neon-blue);
        padding: 8px 22px;
        border-radius: 50px;
        box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
      }

      .dev-badge a {
        color: #ffffff;
        text-decoration: none;
        font-weight: 800;
        font-size: 0.95rem;
        letter-spacing: 1.5px;
        direction: ltr;
      }

      .dev-badge .dot {
        width: 8px;
        height: 8px;
        background: var(--neon-blue);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--neon-blue);
      }

      /* مربع عداد الزوار المتطور */
      .visitor-dock {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(3, 7, 18, 0.7);
        border: 1px solid rgba(0, 240, 255, 0.25);
        border-radius: 16px;
        padding: 12px 20px;
        margin-bottom: 20px;
        position: relative;
        overflow: hidden;
        box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.05);
      }

      .visitor-dock::before {
        content: '';
        position: absolute;
        top: 0;
        right: 0;
        width: 4px;
        height: 100%;
        background: var(--neon-blue);
        box-shadow: 0 0 10px var(--neon-blue);
      }

      .visitor-meta {
        display: flex;
        align-items: center;
        gap: 12px;
        text-align: right;
      }

      .radar-box {
        position: relative;
        width: 38px;
        height: 38px;
        background: rgba(0, 240, 255, 0.1);
        border: 1px solid rgba(0, 240, 255, 0.3);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .radar-pulse {
        width: 10px;
        height: 10px;
        background: var(--neon-blue);
        border-radius: 50%;
        box-shadow: 0 0 10px var(--neon-blue);
        animation: pulseGlow 1.8s infinite;
      }

      @keyframes pulseGlow {
        0% { transform: scale(0.9); box-shadow: 0 0 5px var(--neon-blue); }
        50% { transform: scale(1.3); box-shadow: 0 0 15px var(--neon-blue); }
        100% { transform: scale(0.9); box-shadow: 0 0 5px var(--neon-blue); }
      }

      .visitor-titles {
        display: flex;
        flex-direction: column;
      }

      .visitor-title {
        font-size: 0.95rem;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: 0.5px;
      }

      .visitor-sub {
        font-size: 0.72rem;
        color: var(--text-sub);
        font-family: monospace;
        direction: ltr;
        text-align: right;
      }

      .visitor-stats {
        display: flex;
        align-items: baseline;
        gap: 6px;
        direction: ltr;
      }

      #visitor-count {
        font-size: 1.5rem;
        font-weight: 900;
        font-family: 'Consolas', 'Courier New', monospace;
        color: var(--neon-blue);
        text-shadow: 0 0 12px var(--neon-glow);
        letter-spacing: 2px;
      }

      .visitor-unit {
        font-size: 0.75rem;
        color: var(--text-sub);
        font-weight: 700;
        letter-spacing: 1px;
      }

      #brand {
        display: none;
      }

      /* منطقة التحميل والجيلبريك */
      .exploit-card {
        background: rgba(3, 7, 18, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        padding: 30px 20px;
        margin-top: 10px;
        position: relative;
      }

      #spin {
        width: 60px;
        height: 60px;
        margin: 10px auto;
        border: 4px solid rgba(0, 240, 255, 0.15);
        border-top: 4px solid var(--neon-blue);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        box-shadow: 0 0 20px var(--neon-glow);
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      #msg {
        display: none;
        margin: 15px auto 0;
        padding: 14px 20px;
        background: linear-gradient(180deg, rgba(255, 0, 85, 0.2), rgba(255, 0, 85, 0.05));
        border: 1px solid var(--danger);
        border-radius: 12px;
        color: #ff99bb;
        font-weight: 800;
        font-size: 1.1rem;
        letter-spacing: 1px;
        text-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
      }

      #wrap {
        padding: 0;
      }

      #state, #out {
        display: none;
      }

      body.done #spin { display: none; }
      body.fail #spin { display: none; }
      body.fail #msg { display: block; }

      /* شاشة السجلات (?log=1) */
      body.log #spin,
      body.log #msg {
        display: none;
      }

      body.log #wrap {
        display: block;
        margin-top: 10px;
        text-align: left;
        direction: ltr;
      }

      body.log #state {
        display: block;
        font-size: 1.2rem;
        font-weight: 800;
        color: var(--neon-blue);
        margin: 0 0 12px;
        text-shadow: 0 0 10px var(--neon-glow);
        text-align: center;
        direction: rtl;
      }

      body.log #out {
        display: block;
        white-space: pre-wrap;
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 12px;
        line-height: 1.5;
        background: rgba(3, 7, 18, 0.95);
        border: 1px solid rgba(0, 240, 255, 0.25);
        border-radius: 12px;
        padding: 14px;
        max-height: 380px;
        overflow-y: auto;
        color: var(--text-main);
        box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9);
      }

      .ok, .safe { color: var(--success); font-weight: bold; }
      .bad, .danger { color: var(--danger); font-weight: bold; }
      .warn { color: var(--warning); font-weight: bold; }
      code {
        color: var(--neon-blue);
        background: rgba(0, 240, 255, 0.1);
        padding: 2px 6px;
        border-radius: 4px;
      }

      .hud-footer {
        margin-top: 30px;
        padding-top: 18px;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.75rem;
        color: #475569;
        direction: ltr;
      }

      .status-pill {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--neon-blue);
        font-weight: bold;
      }

      .status-pill span {
        display: inline-block;
        width: 8px;
        height: 8px;
        background: var(--neon-blue);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--neon-blue);
      }

      @media (max-width: 600px) {
        .main-title { font-size: 1.4rem; }
        .hud-container { padding: 25px 15px; }
        .hud-footer { flex-direction: column; gap: 10px; }
      }
    </style>
  </head>
  <body>
    <div class="hud-container">
      <header class="site-header">
        <div class="logo-frame">
          <img src="includes/logo.png" alt="Dev Logo" class="header-logo" onerror="this.style.display='none'; document.querySelector('.logo-frame').style.display='none';">
        </div>
        <h1 class="main-title">كولد هين المطور علي أسامة</h1>
        <p class="sub-tagline">GoldHEN Exploit Stage &middot; v13.52</p>
        <div class="dev-badge-wrapper">
          <div class="dev-badge">
            <div class="dot"></div>
            <a href="https://t.me/BBTBB" target="_blank">DEV : @BBTBB</a>
          </div>
        </div>
      </header>

      <div id="brand"></div>

      <!-- مربع عداد الزوار الذكي متزامن بالكامل -->
      <div class="visitor-dock">
        <div class="visitor-meta">
          <div class="radar-box">
            <div class="radar-pulse"></div>
          </div>
          <div class="visitor-titles">
            <span class="visitor-title">إجمالي الزيارات</span>
            <span class="visitor-sub">TOTAL VISITS COUNTER</span>
          </div>
        </div>
        <div class="visitor-stats">
          <span id="visitor-count">50</span>
          <span class="visitor-unit">HITS</span>
        </div>
      </div>

      <!-- منصة التنفيذ وسير التحميل -->
      <div class="exploit-card">
        <div id="spin"></div>
        <div id="msg">Restart your console</div>
        <div id="wrap">
          <div id="state"></div>
          <div id="out"></div>
        </div>
      </div>

      <footer class="hud-footer">
        <div>STAGE 2 LOADER &middot; &copy; 2026 Ali Osama</div>
        <div class="status-pill">
          <span></span> EXPLOIT IN PROGRESS
        </div>
      </footer>
    </div>

    <script>
      /* مزامنة عداد الزوار المتطور (زيادة تلقائية ومزامنة سحابية) */
      (function setupVisitorCounter() {
        var countEl = document.getElementById("visitor-count");
        var baseVisits = 50;
        var storageKey = "aliosama_visits_v50";
        
        var current = parseInt(localStorage.getItem(storageKey) || baseVisits, 10);
        current++;
        localStorage.setItem(storageKey, current);

        function render(num) {
          if (countEl) countEl.textContent = Number(num).toLocaleString('en-US');
        }
        render(current);

        if (navigator.onLine) {
          fetch("https://api.counterapi.dev/v1/aliosama_ps4_global/hits/up")
            .then(function(res) {
              if (!res.ok) throw new Error("HTTP error " + res.status);
              return res.json();
            })
            .then(function(data) {
              if (data && typeof data.count === "number") {
                var total = baseVisits + data.count;
                if (total > current) {
                  localStorage.setItem(storageKey, total);
                  render(total);
                }
              }
            })
            .catch(function(err) {});
        }
      })();
    </script>

    <script type="module">
      import "./jb.js";
    </script>
  </body>
</html>
